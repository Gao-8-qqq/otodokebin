<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js" integrity="sha384-ZaR6mWzmJtrRibZ1Vm7SoHFr8OXjyAuGAXalGDKqbxFT18oi/z+oZLIRFkpeNor1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js" integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js" integrity="sha384-Ke0FJhH7LyRqDxZ0wt+/OXV38yfQVu7g9VPEEGjYmB4RVOY/ta04uecRhsMwT7V3" crossorigin="anonymous"></script>
<style>
  :root {
    --night: #070b18;
    --night-2: #0a1020;
    --panel: #0c1224;
    --panel-2: #121a33;
    --wire: #1d2745;
    --text: #f2f0fb;
    --muted: #9aa3c4;
    --violet: #c967e8;
    --violet-hi: #e4a6f7;
    --pink: #ff5fb4;
    --cyan: #5fd3ff;
    --amber: #ffc25a;
    --danger: #ff6b7a;
    --ok: #6cffc4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(70% 35% at 15% 0%, rgba(201, 103, 232, .14), transparent 70%),
      radial-gradient(60% 30% at 90% 20%, rgba(95, 211, 255, .08), transparent 70%),
      var(--night);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Sans", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--cyan); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(100px + env(safe-area-inset-bottom)); }

  /* ---- ヘッダーのロゴ ---- */
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 2px 14px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo svg { width: 34px; height: 18px; flex: none; }
  .logo h1 {
    margin: 0;
    font-family: "RocknRoll One", sans-serif;
    font-weight: 400;
    font-size: 24px;
    letter-spacing: .06em;
    line-height: 1;
    color: var(--violet-hi);
    text-shadow: 0 0 6px rgba(201, 103, 232, .9), 0 0 18px rgba(201, 103, 232, .55);
    animation: power-on 1.4s steps(1, end) both;
  }
  .logo .kana { font-size: 11px; color: var(--muted); letter-spacing: .2em; }
  @keyframes power-on {
    0% { opacity: .2; text-shadow: none; }
    14% { opacity: 1; }
    20% { opacity: .3; text-shadow: none; }
    30%, 100% { opacity: 1; }
  }
  .who {
    font-size: 12px; color: var(--muted); background: transparent;
    border: 1px solid var(--wire); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .who:hover { color: var(--text); border-color: var(--violet); }

  /* ---- 大きなカード ---- */
  .panel {
    background: linear-gradient(180deg, var(--panel-2), var(--panel) 40%);
    border: 1px solid var(--wire);
    border-radius: 24px;
    padding: 18px;
  }
  .panel + .panel, .panel + .sec { margin-top: 18px; }

  /* ---- ヒーロー ---- */
  .hero-art {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% 110%, rgba(95, 211, 255, .12), transparent 60%),
      linear-gradient(180deg, #0b1230, #070b1c);
    border: 1px solid #222d55;
    aspect-ratio: 17 / 10;
  }
  .hero-art svg { display: block; width: 100%; height: 100%; }
  .float { animation: bob 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twinkle { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twinkle.d2 { animation-delay: 1.1s; }
  .twinkle.d3 { animation-delay: 2.1s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .logo h1, .float, .twinkle { animation: none; }
  }
  .hero-title {
    font-family: "RocknRoll One", sans-serif;
    font-weight: 400;
    font-size: 23px;
    line-height: 1.45;
    margin: 18px 0 6px;
  }
  .hero-sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .stack { display: grid; gap: 10px; }

  .sec {
    font-family: "RocknRoll One", sans-serif;
    font-weight: 400;
    font-size: 17px;
    margin: 28px 2px 12px;
  }
  .lead { color: var(--muted); font-size: 14px; margin: 0 2px 14px; }
  h2 { font-family: "RocknRoll One", sans-serif; font-weight: 400; font-size: 19px; margin: 22px 0 12px; }

  .card { background: var(--panel); border: 1px solid var(--wire); border-radius: 18px; padding: 16px; }
  .card + .card { margin-top: 12px; }

  /* ---- 気分のネオン管 ---- */
  .moods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .mood {
    --c: var(--violet);
    background: transparent;
    border: 2px solid var(--c);
    border-radius: 999px;
    padding: 13px 12px;
    text-align: center;
    cursor: pointer;
    color: var(--text);
    box-shadow: 0 0 6px color-mix(in srgb, var(--c) 50%, transparent), inset 0 0 6px color-mix(in srgb, var(--c) 30%, transparent);
    opacity: .8;
    transition: opacity .15s, box-shadow .15s, background .15s, transform .1s;
  }
  .mood b { font-weight: 500; font-size: 15px; text-shadow: 0 0 8px color-mix(in srgb, var(--c) 55%, transparent); }
  .mood:hover, .mood:focus-visible {
    opacity: 1;
    background: color-mix(in srgb, var(--c) 10%, transparent);
    box-shadow: 0 0 10px var(--c), 0 0 26px color-mix(in srgb, var(--c) 50%, transparent), inset 0 0 10px color-mix(in srgb, var(--c) 40%, transparent);
  }
  .mood:active { transform: scale(.97); }
  .mood:disabled { opacity: .35; cursor: default; box-shadow: none; }
  .mood.on {
    opacity: 1;
    background: color-mix(in srgb, var(--c) 22%, transparent);
    box-shadow: 0 0 12px var(--c), 0 0 32px color-mix(in srgb, var(--c) 60%, transparent), inset 0 0 12px color-mix(in srgb, var(--c) 50%, transparent);
  }
  .mood.on b { font-weight: 700; }
  .receive-bar {
    position: sticky;
    bottom: calc(76px + env(safe-area-inset-bottom));
    margin-top: 16px;
    padding: 10px 0;
    background: linear-gradient(180deg, transparent, var(--night) 35%);
    z-index: 5;
  }

  /* ---- 届いたセトリ ---- */
  .from { color: var(--muted); font-size: 13px; margin: 0; }
  .set-title { font-family: "RocknRoll One", sans-serif; font-weight: 400; font-size: 24px; margin: 6px 0 4px; line-height: 1.4; }
  .set-sub { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
  .tracklist { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid var(--wire); }
  .tracklist li { border-bottom: 1px solid var(--wire); }
  .trow { display: flex; align-items: center; gap: 14px; padding: 14px 2px; text-decoration: none; color: var(--text); }
  .tno {
    font-family: "RocknRoll One", sans-serif; font-size: 18px; width: 30px; flex: none;
    color: var(--violet-hi); text-shadow: 0 0 8px rgba(201, 103, 232, .7);
  }
  .tthumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; }
  .trow .meta { min-width: 0; flex: 1; }
  .trow .title { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .artist { font-size: 13px; color: #cfc9e6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .svc { font-size: 11px; color: var(--muted); }
  .meta-row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .meta-row .tthumb { width: 56px; height: 56px; }
  .meta-inputs { flex: 1; min-width: 0; display: grid; gap: 6px; }
  .toggle { background: none; border: 1px solid var(--wire); color: var(--text); border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer; margin-top: 10px; }
  .toggle:hover { border-color: var(--cyan); }
  .play {
    width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--cyan); color: #04121c;
    box-shadow: 0 0 10px rgba(95, 211, 255, .55);
    transition: transform .1s, box-shadow .15s;
  }
  .play svg { width: 12px; height: 12px; margin-left: 2px; }
  .trow:hover .play { box-shadow: 0 0 16px rgba(95, 211, 255, .9); }
  .trow:active .play { transform: scale(.92); }
  .quote { margin: 16px 2px 4px; font-size: 14px; color: #dcd8ee; white-space: pre-wrap; word-break: break-word; }

  .react { margin-top: 16px; border: 1px solid var(--violet); border-radius: 18px; padding: 14px; box-shadow: 0 0 12px rgba(201, 103, 232, .2); }
  .react-label { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 12px; color: var(--violet-hi); font-weight: 500; }
  .react-label svg { width: 16px; height: 16px; }
  .stamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .stamp { border: 1px solid var(--wire); background: transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; color: var(--text); }
  .stamp:hover:not(:disabled) { border-color: var(--pink); box-shadow: 0 0 8px rgba(255, 95, 180, .5); }
  .stamp.on {
    border-color: var(--pink); color: #ffe3f1; font-weight: 700; background: rgba(255, 95, 180, .14);
    box-shadow: 0 0 10px var(--pink), 0 0 24px rgba(255, 95, 180, .45); text-shadow: 0 0 6px var(--pink);
  }
  .stamp:disabled:not(.on) { opacity: .35; cursor: default; }

  .tag { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--wire); border-radius: 999px; padding: 2px 10px; }
  .note { background: var(--night-2); border-left: 2px solid var(--violet); padding: 10px 12px; border-radius: 6px; margin: 8px 0 4px; white-space: pre-wrap; word-break: break-word; }

  /* ---- ボタン ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border-radius: 14px; padding: 15px 18px; font-weight: 700; cursor: pointer;
    background: var(--violet); color: #fff; border: 1px solid var(--violet);
    box-shadow: 0 0 18px rgba(201, 103, 232, .45);
    letter-spacing: .04em;
  }
  .btn:hover:not(:disabled) { box-shadow: 0 0 26px rgba(201, 103, 232, .7); }
  .btn:disabled { opacity: .35; cursor: default; box-shadow: none; }
  .btn.outline { background: transparent; color: var(--text); border: 1px solid #2b3863; box-shadow: none; font-weight: 500; }
  .btn.outline:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 10px rgba(95, 211, 255, .3); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--wire); box-shadow: none; font-weight: 500; }
  .btn.ghost:hover:not(:disabled) { border-color: var(--violet); }
  .btn.small { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 10px; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); box-shadow: none; }
  .btn.danger:hover:not(:disabled) { background: rgba(255, 107, 122, .1); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .linkish { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }
  .linkish:hover { color: var(--text); }

  /* ---- 入力 ---- */
  label.field { display: block; font-size: 13px; color: var(--muted); margin: 18px 0 8px; }
  input.input, textarea.input { width: 100%; background: var(--night-2); border: 1px solid var(--wire); border-radius: 12px; padding: 11px 12px; outline: none; }
  input.input:focus, textarea.input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(95, 211, 255, .25); }
  input.input::placeholder, textarea.input::placeholder { color: #626b8f; }
  textarea.input { resize: vertical; min-height: 72px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hint.err { color: var(--danger); }
  .hint.ok { color: var(--ok); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--wire); background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .chip:hover { border-color: var(--violet); }
  .chip.on { border-color: var(--violet); color: #fff; font-weight: 700; background: rgba(201, 103, 232, .18); box-shadow: 0 0 10px rgba(201, 103, 232, .5); }

  .trackrow { background: var(--panel); border: 1px solid var(--wire); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .trackrow .num { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .trackrow .num .tno { font-size: 15px; width: auto; }
  .trackrow .input + .input { margin-top: 6px; }

  /* ---- じぶん ---- */
  .mine-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .count { font-size: 12px; border: 1px solid var(--wire); border-radius: 999px; padding: 2px 10px; }
  .count b { color: var(--pink); margin-left: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }

  /* ---- 下のタブ ---- */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(7, 11, 24, .92); backdrop-filter: blur(12px); border-top: 1px solid var(--wire); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.tabs .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  nav.tabs button { background: none; border: none; padding: 12px 0 14px; cursor: pointer; color: var(--muted); font-size: 12px; display: grid; justify-items: center; gap: 3px; }
  nav.tabs button .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.on { color: var(--text); }
  nav.tabs button.on .ico { color: var(--violet-hi); filter: drop-shadow(0 0 3px var(--violet)) drop-shadow(0 0 8px rgba(201, 103, 232, .7)); }

  /* ---- ログインの選択肢 ---- */
  .btn.social { background: #fff; color: #1f1f1f; border: 1px solid #fff; box-shadow: none; font-weight: 700; letter-spacing: 0; }
  .btn.social:hover:not(:disabled) { box-shadow: 0 0 14px rgba(255, 255, 255, .35); }
  .btn.social svg { width: 18px; height: 18px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 18px 0 12px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--wire); }

  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--violet); box-shadow: 0 0 14px rgba(201, 103, 232, .4); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }

  .overlay { position: fixed; inset: 0; background: rgba(3, 5, 12, .7); display: grid; place-items: end center; z-index: 20; }
  .sheet { background: var(--panel); border: 1px solid var(--wire); border-bottom: none; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; padding: 22px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
  .sheet h3 { margin: 0 0 8px; font-size: 17px; font-family: "RocknRoll One", sans-serif; font-weight: 400; }
  .sheet p { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .sheet ul { color: var(--muted); font-size: 14px; padding-left: 20px; }

  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
  footer.foot { text-align: center; margin-top: 32px; }
  .sister-line { margin-top: 6px; font-size: 11px; color: var(--muted); }
  .sister-line a { color: var(--muted); }
</style>
</head>
<body>
<div id="root"><div class="loading">読み込み中…</div></div>

<script src="app.js?v=320523eae2" integrity="sha384-kHxrnmWf+/AwDypeBgLFB2tobAwW4FG04tAep5wI/FnmefXvj9Tl9Zvek3D8RMSp"></script>
</body>
