<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音届便 おとどけびん</title>
<meta name="description" content="今の気分を選ぶと、同じ気分の誰かのセトリが届く。">
<meta name="theme-color" content="#070b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --night: #070b18;
    --night-2: #0a1020;
    --panel: #0c1224;
    --panel-2: #121a33;
    --wire: #1d2745;
    --text: #f2f0fb;
    --muted: #9aa3c4;
    --violet: #c967e8;
    --violet-hi: #e4a6f7;
    --pink: #ff5fb4;
    --cyan: #5fd3ff;
    --amber: #ffc25a;
    --danger: #ff6b7a;
    --ok: #6cffc4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(70% 35% at 15% 0%, rgba(201, 103, 232, .14), transparent 70%),
      radial-gradient(60% 30% at 90% 20%, rgba(95, 211, 255, .08), transparent 70%),
      var(--night);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Sans", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--cyan); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(100px + env(safe-area-inset-bottom)); }

  /* ---- ヘッダーのロゴ ---- */
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 2px 14px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo svg { width: 34px; height: 18px; flex: none; }
  .logo h1 {
    margin: 0;
    font-family: "RocknRoll One", sans-serif;
    font-weight: 400;
    font-size: 24px;
    letter-spacing: .06em;
    line-height: 1;
    color: var(--violet-hi);
    text-shadow: 0 0 6px rgba(201, 103, 232, .9), 0 0 18px rgba(201, 103, 232, .55);
    animation: power-on 1.4s steps(1, end) both;
  }
  .logo .kana { font-size: 11px; color: var(--muted); letter-spacing: .2em; }
  @keyframes power-on {
    0% { opacity: .2; text-shadow: none; }
    14% { opacity: 1; }
    20% { opacity: .3; text-shadow: none; }
    30%, 100% { opacity: 1; }
  }
  .who {
    font-size: 12px; color: var(--muted); background: transparent;
    border: 1px solid var(--wire); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .who:hover { color: var(--text); border-color: var(--violet); }

  /* ---- 大きなカード ---- */
  .panel {
    background: linear-gradient(180deg, var(--panel-2), var(--panel) 40%);
    border: 1px solid var(--wire);
    border-radius: 24px;
    padding: 18px;
  }
  .panel + .panel, .panel + .sec { margin-top: 18px; }

  /* ---- ヒーロー ---- */
  .hero-art {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% 110%, rgba(95, 211, 255, .12), transparent 60%),
      linear-gradient(180deg, #0b1230, #070b1c);
    border: 1px solid #222d55;
    aspect-ratio: 17 / 10;
  }
  .hero-art svg { display: block; width: 100%; height: 100%; }
  .float { animation: bob 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twinkle { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twinkle.d2 { animation-delay: 1.1s; }
  .twinkle.d3 { animation-delay: 2.1s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .logo h1, .float, .twinkle { animation: none; }
  }
  .hero-title {
    font-family: "RocknRoll One", sans-serif;
    font-weight: 400;
    font-size: 23px;
    line-height: 1.45;
    margin: 18px 0 6px;
  }
  .hero-sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .stack { display: grid; gap: 10px; }

  .sec {
    font-family: "RocknRoll One", sans-serif;
    font-weight: 400;
    font-size: 17px;
    margin: 28px 2px 12px;
  }
  .lead { color: var(--muted); font-size: 14px; margin: 0 2px 14px; }
  h2 { font-family: "RocknRoll One", sans-serif; font-weight: 400; font-size: 19px; margin: 22px 0 12px; }

  .card { background: var(--panel); border: 1px solid var(--wire); border-radius: 18px; padding: 16px; }
  .card + .card { margin-top: 12px; }

  /* ---- 気分のネオン管 ---- */
  .moods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .mood {
    --c: var(--violet);
    background: transparent;
    border: 2px solid var(--c);
    border-radius: 999px;
    padding: 13px 12px;
    text-align: center;
    cursor: pointer;
    color: var(--text);
    box-shadow: 0 0 6px color-mix(in srgb, var(--c) 50%, transparent), inset 0 0 6px color-mix(in srgb, var(--c) 30%, transparent);
    opacity: .8;
    transition: opacity .15s, box-shadow .15s, background .15s, transform .1s;
  }
  .mood b { font-weight: 500; font-size: 15px; text-shadow: 0 0 8px color-mix(in srgb, var(--c) 55%, transparent); }
  .mood:hover, .mood:focus-visible {
    opacity: 1;
    background: color-mix(in srgb, var(--c) 10%, transparent);
    box-shadow: 0 0 10px var(--c), 0 0 26px color-mix(in srgb, var(--c) 50%, transparent), inset 0 0 10px color-mix(in srgb, var(--c) 40%, transparent);
  }
  .mood:active { transform: scale(.97); }
  .mood:disabled { opacity: .35; cursor: default; box-shadow: none; }

  /* ---- 届いたセトリ ---- */
  .from { color: var(--muted); font-size: 13px; margin: 0; }
  .set-title { font-family: "RocknRoll One", sans-serif; font-weight: 400; font-size: 24px; margin: 6px 0 4px; line-height: 1.4; }
  .set-sub { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
  .tracklist { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid var(--wire); }
  .tracklist li { border-bottom: 1px solid var(--wire); }
  .trow { display: flex; align-items: center; gap: 14px; padding: 14px 2px; text-decoration: none; color: var(--text); }
  .tno {
    font-family: "RocknRoll One", sans-serif; font-size: 18px; width: 30px; flex: none;
    color: var(--violet-hi); text-shadow: 0 0 8px rgba(201, 103, 232, .7);
  }
  .tthumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; }
  .trow .meta { min-width: 0; flex: 1; }
  .trow .title { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .artist { font-size: 13px; color: #cfc9e6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .svc { font-size: 11px; color: var(--muted); }
  .meta-row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .meta-row .tthumb { width: 56px; height: 56px; }
  .meta-inputs { flex: 1; min-width: 0; display: grid; gap: 6px; }
  .toggle { background: none; border: 1px solid var(--wire); color: var(--text); border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer; margin-top: 10px; }
  .toggle:hover { border-color: var(--cyan); }
  .play {
    width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--cyan); color: #04121c;
    box-shadow: 0 0 10px rgba(95, 211, 255, .55);
    transition: transform .1s, box-shadow .15s;
  }
  .play svg { width: 12px; height: 12px; margin-left: 2px; }
  .trow:hover .play { box-shadow: 0 0 16px rgba(95, 211, 255, .9); }
  .trow:active .play { transform: scale(.92); }
  .quote { margin: 16px 2px 4px; font-size: 14px; color: #dcd8ee; white-space: pre-wrap; word-break: break-word; }

  .react { margin-top: 16px; border: 1px solid var(--violet); border-radius: 18px; padding: 14px; box-shadow: 0 0 12px rgba(201, 103, 232, .2); }
  .react-label { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 12px; color: var(--violet-hi); font-weight: 500; }
  .react-label svg { width: 16px; height: 16px; }
  .stamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .stamp { border: 1px solid var(--wire); background: transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; color: var(--text); }
  .stamp:hover:not(:disabled) { border-color: var(--pink); box-shadow: 0 0 8px rgba(255, 95, 180, .5); }
  .stamp.on {
    border-color: var(--pink); color: #ffe3f1; font-weight: 700; background: rgba(255, 95, 180, .14);
    box-shadow: 0 0 10px var(--pink), 0 0 24px rgba(255, 95, 180, .45); text-shadow: 0 0 6px var(--pink);
  }
  .stamp:disabled:not(.on) { opacity: .35; cursor: default; }

  .tag { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--wire); border-radius: 999px; padding: 2px 10px; }
  .note { background: var(--night-2); border-left: 2px solid var(--violet); padding: 10px 12px; border-radius: 6px; margin: 8px 0 4px; white-space: pre-wrap; word-break: break-word; }

  /* ---- ボタン ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border-radius: 14px; padding: 15px 18px; font-weight: 700; cursor: pointer;
    background: var(--violet); color: #fff; border: 1px solid var(--violet);
    box-shadow: 0 0 18px rgba(201, 103, 232, .45);
    letter-spacing: .04em;
  }
  .btn:hover:not(:disabled) { box-shadow: 0 0 26px rgba(201, 103, 232, .7); }
  .btn:disabled { opacity: .35; cursor: default; box-shadow: none; }
  .btn.outline { background: transparent; color: var(--text); border: 1px solid #2b3863; box-shadow: none; font-weight: 500; }
  .btn.outline:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 10px rgba(95, 211, 255, .3); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--wire); box-shadow: none; font-weight: 500; }
  .btn.ghost:hover:not(:disabled) { border-color: var(--violet); }
  .btn.small { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 10px; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); box-shadow: none; }
  .btn.danger:hover:not(:disabled) { background: rgba(255, 107, 122, .1); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .linkish { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }
  .linkish:hover { color: var(--text); }

  /* ---- 入力 ---- */
  label.field { display: block; font-size: 13px; color: var(--muted); margin: 18px 0 8px; }
  input.input, textarea.input { width: 100%; background: var(--night-2); border: 1px solid var(--wire); border-radius: 12px; padding: 11px 12px; outline: none; }
  input.input:focus, textarea.input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(95, 211, 255, .25); }
  input.input::placeholder, textarea.input::placeholder { color: #626b8f; }
  textarea.input { resize: vertical; min-height: 72px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hint.err { color: var(--danger); }
  .hint.ok { color: var(--ok); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--wire); background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .chip:hover { border-color: var(--violet); }
  .chip.on { border-color: var(--violet); color: #fff; font-weight: 700; background: rgba(201, 103, 232, .18); box-shadow: 0 0 10px rgba(201, 103, 232, .5); }

  .trackrow { background: var(--panel); border: 1px solid var(--wire); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .trackrow .num { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .trackrow .num .tno { font-size: 15px; width: auto; }
  .trackrow .input + .input { margin-top: 6px; }

  /* ---- じぶん ---- */
  .mine-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .count { font-size: 12px; border: 1px solid var(--wire); border-radius: 999px; padding: 2px 10px; }
  .count b { color: var(--pink); margin-left: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }

  /* ---- 下のタブ ---- */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(7, 11, 24, .92); backdrop-filter: blur(12px); border-top: 1px solid var(--wire); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.tabs .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  nav.tabs button { background: none; border: none; padding: 12px 0 14px; cursor: pointer; color: var(--muted); font-size: 12px; display: grid; justify-items: center; gap: 3px; }
  nav.tabs button .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.on { color: var(--text); }
  nav.tabs button.on .ico { color: var(--violet-hi); filter: drop-shadow(0 0 3px var(--violet)) drop-shadow(0 0 8px rgba(201, 103, 232, .7)); }

  /* ---- ログインの選択肢 ---- */
  .btn.social { background: #fff; color: #1f1f1f; border: 1px solid #fff; box-shadow: none; font-weight: 700; letter-spacing: 0; }
  .btn.social:hover:not(:disabled) { box-shadow: 0 0 14px rgba(255, 255, 255, .35); }
  .btn.social svg { width: 18px; height: 18px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 18px 0 12px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--wire); }

  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--violet); box-shadow: 0 0 14px rgba(201, 103, 232, .4); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }

  .overlay { position: fixed; inset: 0; background: rgba(3, 5, 12, .7); display: grid; place-items: end center; z-index: 20; }
  .sheet { background: var(--panel); border: 1px solid var(--wire); border-bottom: none; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; padding: 22px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
  .sheet h3 { margin: 0 0 8px; font-size: 17px; font-family: "RocknRoll One", sans-serif; font-weight: 400; }
  .sheet p { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .sheet ul { color: var(--muted); font-size: 14px; padding-left: 20px; }

  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
  footer.foot { text-align: center; margin-top: 32px; }
</style>
</head>
<body>
<div id="root"><div class="loading">読み込み中…</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// ===== 設定 =====
const SUPABASE_URL = 'https://xqnhxjepxzglmsnmdrvm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FRoeyOoJFYtM7QsQ8cjuqw_2yqFF7bj';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STAMPS = [
  { id: 'sasatta', label: '刺さった' },
  { id: 'naita',   label: '泣いた' },
  { id: 'genki',   label: '元気出た' },
  { id: 'wakaru',  label: 'わかる' },
  { id: 'suki',    label: '好き' },
  { id: 'mata',    label: 'また聴く' },
];
const SERVICES = {
  youtube: 'YouTube',
  spotify: 'Spotify',
  apple_music: 'Apple Music',
  amazon_music: 'Amazon Music',
};
const TUBES = ['var(--violet)', 'var(--cyan)', 'var(--pink)', 'var(--amber)'];
const REDIRECT_TO = location.origin + location.pathname;

// ===== 便利関数 =====
function detectService(raw) {
  try {
    const u = new URL(raw.trim());
    if (u.protocol !== 'https:') return null;
    const h = u.hostname.replace(/^www\./, '').replace(/^m\./, '');
    if (h === 'youtu.be' || h === 'youtube.com' || h === 'music.youtube.com') return 'youtube';
    if (h === 'open.spotify.com' || h === 'spotify.link') return 'spotify';
    if (h === 'music.apple.com') return 'apple_music';
    if (h.startsWith('music.amazon.')) return 'amazon_music';
    if (h.startsWith('amazon.') && u.pathname.includes('/music')) return 'amazon_music';
  } catch (e) { /* URLじゃない */ }
  return null;
}

// 曲名・アーティスト名・サムネを取りに行く（取れなくても手入力でOK）
// まずSupabaseの track-info（song.link経由で全サービス対応）、だめならブラウザから直接
async function fetchMeta(url, service) {
  try {
    const { data, error } = await sb.functions.invoke('track-info', { body: { url } });
    if (!error && data && (data.title || data.artist)) {
      return { title: data.title || '', artist: data.artist || '', thumbnail: data.thumbnail || '' };
    }
  } catch (e) { /* 次の方法へ */ }
  let endpoint = null;
  if (service === 'spotify') endpoint = 'https://open.spotify.com/oembed?url=' + encodeURIComponent(url);
  if (service === 'youtube') endpoint = 'https://noembed.com/embed?url=' + encodeURIComponent(url);
  if (!endpoint) return {};
  try {
    const r = await fetch(endpoint);
    if (!r.ok) return {};
    const j = await r.json();
    if (j.error) return {};
    const artist = service === 'youtube' ? (j.author_name || '').replace(/ - Topic$/, '') : '';
    return { title: j.title || '', artist, thumbnail: j.thumbnail_url || '' };
  } catch (e) { return {}; }
}

function errMsg(e) {
  const m = (e && (e.message || e.details)) || String(e);
  if (m.includes('daily_limit_reached')) return '今日の受け取りはここまで。また明日届くよ。';
  if (m.includes('login_required')) return 'この機能はログインが必要だよ。';
  if (m.includes('tracks_must_be_3_to_10')) return '曲は3〜10曲で作ってね。';
  if (m.includes('setlists_comment_check')) return 'ひとことは100字以内で、URLやSNSのIDは書けないよ。';
  if (m.includes('duplicate key')) return 'もう送信済みだよ。';
  if (m.includes('row-level security')) return 'その操作はできないみたい。';
  return 'うまくいかなかった…（' + m + '）';
}

// ===== 小さな部品 =====
function Toast({ text }) {
  if (!text) return null;
  return <div className="toast" role="status">{text}</div>;
}

function Sheet({ onClose, children }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>{children}</div>
    </div>
  );
}

function Confirm({ title, body, okLabel, danger, onOk, onCancel }) {
  return (
    <Sheet onClose={onCancel}>
      <h3>{title}</h3>
      {body && <p>{body}</p>}
      <div className="row">
        <button className="btn ghost" onClick={onCancel}>やめる</button>
        <button className={'btn' + (danger ? ' danger' : '')} onClick={onOk}>{okLabel}</button>
      </div>
    </Sheet>
  );
}

function TrackItem({ t, i }) {
  const label = t.title || (SERVICES[t.service] + ' の曲');
  return (
    <li>
      <a className="trow" href={t.url} target="_blank" rel="noopener noreferrer">
        <span className="tno">{String(i + 1).padStart(2, '0')}</span>
        {t.thumbnail && <img className="tthumb" src={t.thumbnail} alt="" loading="lazy" referrerPolicy="no-referrer" />}
        <span className="meta">
          <div className="title">{label}</div>
          {t.artist && <div className="artist">{t.artist}</div>}
          <div className="svc">{SERVICES[t.service]} で開く</div>
        </span>
        <span className="play" aria-hidden="true">
          <svg viewBox="0 0 12 12"><path d="M2 1.2v9.6L10.6 6z" fill="currentColor"/></svg>
        </span>
      </a>
    </li>
  );
}

// 看板イラスト：音符の入ったネオンのボトル
function NeonBottle() {
  return (
    <svg viewBox="0 0 340 200" role="img" aria-label="音符の入ったボトルが波間に浮かんでいる">
      <defs>
        <filter id="nb-glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="3.2" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="nb-soft" x="-50%" y="-200%" width="200%" height="500%">

// ===== ログイン =====
function LoginForm({ user, onDone, toast }) {
  const [email, setEmail] = useState('');
  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!email.includes('@')) return toast('メールアドレスを入れてね');
    setBusy(true);
    try {
      // ゲストのままメールを登録すると、ゲスト時代の履歴を引き継げる
      if (user && user.is_anonymous) {
        const { error } = await sb.auth.updateUser({ email }, { emailRedirectTo: REDIRECT_TO });
        if (!error) { setSent(true); return; }
        if (!/already|exists|registered/i.test(error.message)) throw error;
      }
      // すでに登録済みのメールはログインリンクを送る
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: REDIRECT_TO } });
      if (error) throw error;
      setSent(true);
    } catch (err) {
      toast(errMsg(err));
    } finally {
      setBusy(false);
    }
  };

  if (sent) {
    return (
      <div>
        <p className="hint ok">メールを送ったよ。届いたリンクを開くとログインできる。</p>
        {onDone && <button className="btn ghost" onClick={onDone}>閉じる</button>}
      </div>
    );
  }
  const google = async () => {
    setBusy(true);
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: REDIRECT_TO } });
    if (error) { setBusy(false); toast(errMsg(error)); }
  };

  return (
    <div>
      <button className="btn social" onClick={google} disabled={busy}>
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <path d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.97 10.72A5.41 5.41 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z" fill="#FBBC05"/>
          <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Googleでログイン
      </button>
      <div className="or"><span>またはメールで</span></div>
      <form onSubmit={submit}>
        <label className="field" htmlFor="email" style={{ marginTop: 0 }}>メールアドレス</label>
        <input id="email" className="input" type="email" autoComplete="email" value={email}
               onChange={e => setEmail(e.target.value)} placeholder="you@example.com" />
        <p className="hint">パスワードはいらないよ。届いたリンクを開くだけ。</p>
        <button className="btn outline" disabled={busy} style={{ marginTop: 12 }}>{busy ? '送信中…' : 'ログインリンクを送る'}</button>
      </form>
    </div>
  );
}

// ===== 受け取る =====
function ReceiveTab({ scenes, toast, goCreate }) {
  const [busy, setBusy] = useState(false);
  const [got, setGot] = useState(null);      // 届いたセトリ
  const [none, setNone] = useState(null);    // 届けられるものがなかったシーン
  const [stamp, setStamp] = useState(null);  // 送ったスタンプ
  const [confirm, setConfirm] = useState(null);

  const receive = async (scene) => {
    setBusy(true); setNone(null);
    try {
      const { data, error } = await sb.rpc('receive_setlist', { p_scene_id: scene.id });
      if (error) throw error;
      if (!data) { setNone(scene.name); return; }
      setGot(data); setStamp(null);
    } catch (e) {
      toast(errMsg(e));
    } finally {
      setBusy(false);
    }
  };

  const sendStamp = async (id) => {
    if (stamp) return;
    setStamp(id);
    const { error } = await sb.from('reactions').insert({ delivery_id: got.delivery_id, setlist_id: got.setlist_id, stamp: id });
    if (error) { setStamp(null); toast(errMsg(error)); return; }
    toast('作った人にこっそり届けたよ');
  };

  const report = async () => {
    setConfirm(null);
    const { error } = await sb.from('reports').insert({ target_type: 'setlist', target_id: got.setlist_id });
    if (error) return toast(errMsg(error));
    toast('通報したよ。ありがとう');
  };

  const block = async () => {
    setConfirm(null);
    const { error } = await sb.rpc('block_author', { p_delivery_id: got.delivery_id });
    if (error) return toast(errMsg(error));
    toast('この人のセトリはもう届かないよ');
    setGot(null);
  };

  if (got) {
    const n = (got.tracks || []).length;
    return (
      <div>
        <div className="panel">
          <p className="from">だれかから、ボトルが届いたよ</p>
          <h2 className="set-title">{got.scene}のセトリ</h2>
          <p className="set-sub">誰かが、この気分のときに聴いてる{n}曲。</p>
          <ul className="tracklist">
            {(got.tracks || []).map((t, i) => <TrackItem key={i} t={t} i={i} />)}
          </ul>
          {got.comment && <p className="quote">「{got.comment}」</p>}
          <div className="react">
            <p className="react-label">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14s-5.5-3.3-5.5-7.2C2.5 4.6 4 3.2 5.7 3.2c1 0 1.8.5 2.3 1.3.5-.8 1.3-1.3 2.3-1.3 1.7 0 3.2 1.4 3.2 3.6C13.5 10.7 8 14 8 14z" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/></svg>
              {stamp ? '匿名で感想を送ったよ' : '匿名で感想を送る'}
            </p>
            <div className="stamps" aria-label="スタンプで感想">
              {STAMPS.map(s => (
                <button key={s.id} className={'stamp' + (stamp === s.id ? ' on' : '')}
                        disabled={!!stamp} onClick={() => sendStamp(s.id)}>{s.label}</button>
              ))}
            </div>
          </div>
        </div>
        <div style={{ marginTop: 14 }}>
          <button className="btn" onClick={() => setGot(null)}>別の気分を選ぶ</button>
        </div>
        <div style={{ textAlign: 'center', marginTop: 10 }}>
          <button className="linkish" onClick={() => setConfirm('report')}>通報する</button>
          <button className="linkish" onClick={() => setConfirm('block')}>この人をブロック</button>
        </div>
        {confirm === 'report' && <Confirm title="このセトリを通報する？" body="不適切な内容や迷惑な投稿を見つけたときに使ってね。" okLabel="通報する" danger onOk={report} onCancel={() => setConfirm(null)} />}
        {confirm === 'block' && <Confirm title="この人をブロックする？" body="相手が誰かはわからないまま、この人のセトリが届かなくなるよ。" okLabel="ブロックする" danger onOk={block} onCancel={() => setConfirm(null)} />}
      </div>
    );
  }

  const toMoods = () => document.getElementById('moods')?.scrollIntoView({ behavior: 'smooth', block: 'start' });

  return (
    <div>
      <section className="panel">
        <div className="hero-art"><NeonBottle /></div>
        <h2 className="hero-title">今の気分に、誰かのセトリを。</h2>
        <p className="hero-sub">気分を選ぶと、同じ気分のときに誰かが聴いてる曲が、ボトルに入って届くよ。</p>
        <div className="stack">
          <button className="btn" onClick={toMoods}>セトリを受け取る</button>
          <button className="btn outline" onClick={goCreate}>セトリを作って届ける</button>
        </div>
      </section>
      <h3 className="sec" id="moods">いまの気分は？</h3>
      <div className="moods">
        {scenes.map((s, i) => (
          <button key={s.id} className="mood" disabled={busy} onClick={() => receive(s)}
                  style={{ '--c': TUBES[i % TUBES.length] }}>
            <b>{s.name}</b>
          </button>
        ))}
      </div>
      {none && (
        <div className="card empty" style={{ marginTop: 14 }}>
          「{none}」のセトリは、今はもう届けられるものがないみたい。<br />
          あなたのセトリを流してみない？
        </div>
      )}
    </div>
  );
}

// ===== 作る =====
const emptyTrack = () => ({ url: '', title: '', artist: '', thumbnail: '', service: null, loading: false });

function CreateTab({ user, scenes, toast, onCreated, openLogin }) {
  const [sceneId, setSceneId] = useState(null);
  const [tracks, setTracks] = useState([emptyTrack(), emptyTrack(), emptyTrack()]);
  const [comment, setComment] = useState('');
  const [busy, setBusy] = useState(false);

  if (!user || user.is_anonymous) {
    return (
      <div>
        <h2>セトリを流す</h2>
        <div className="card">
          <p style={{ marginTop: 0 }}>セトリを作るにはログインが必要だよ。メールアドレスだけでOK。</p>
          <button className="btn" onClick={openLogin}>ログインする</button>
        </div>
      </div>
    );
  }

  const update = (i, patch) => setTracks(ts => ts.map((t, j) => j === i ? { ...t, ...patch } : t));

  const onUrlBlur = async (i) => {
    const t = tracks[i];
    const service = detectService(t.url);
    update(i, { service });
    if (!service || t.title || t.loading) return;
    update(i, { loading: true });
    const meta = await fetchMeta(t.url.trim(), service);
    setTracks(ts => ts.map((x, j) => j !== i ? x : {
      ...x,
      loading: false,
      title: x.title || meta.title || '',
      artist: x.artist || meta.artist || '',
      thumbnail: meta.thumbnail || '',
    }));
  };

  const filled = tracks.filter(t => t.url.trim());
  const allValid = filled.every(t => detectService(t.url));
  const canSubmit = sceneId && filled.length >= 3 && filled.length <= 10 && allValid && !busy;

  const submit = async () => {
    if (!canSubmit) return;
    setBusy(true);
    try {
      const payload = filled.map(t => ({
        url: t.url.trim(),
        service: detectService(t.url),
        title: t.title.trim() || null,
        artist: t.artist.trim() || null,
        thumbnail: t.thumbnail || null,
      }));
      const { error } = await sb.rpc('create_setlist', { p_scene_id: sceneId, p_comment: comment, p_tracks: payload });
      if (error) throw error;
      toast('セトリを流したよ。誰かに届きますように');
      setSceneId(null); setTracks([emptyTrack(), emptyTrack(), emptyTrack()]); setComment('');
      onCreated();
    } catch (e) {
      toast(errMsg(e));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div>
      <h2>セトリを流す</h2>

      <label className="field">どんなときに聴く？</label>
      <div className="chips">
        {scenes.map(s => (
          <button key={s.id} className={'chip' + (sceneId === s.id ? ' on' : '')} onClick={() => setSceneId(s.id)}>{s.name}</button>
        ))}
      </div>

      <label className="field">曲のリンク（3〜10曲）</label>
      {tracks.map((t, i) => {
        const bad = t.url.trim() && !detectService(t.url);
        return (
          <div className="trackrow" key={i}>
            <div className="num">
              <span><span className="tno">{String(i + 1).padStart(2, '0')}</span> {t.service && <span className="hint ok">{SERVICES[t.service]}</span>}</span>
              {tracks.length > 3 && (
                <button className="linkish" onClick={() => setTracks(ts => ts.filter((_, j) => j !== i))}>削除</button>
              )}
            </div>
            <input className="input" inputMode="url" placeholder="YouTube / Spotify / Apple Music / Amazon Music のリンク"
                   value={t.url}
                   onChange={e => update(i, { url: e.target.value, service: null, title: '', artist: '', thumbnail: '' })}
                   onBlur={() => onUrlBlur(i)} />
            <div className="meta-row">
              {t.thumbnail && <img className="tthumb" src={t.thumbnail} alt="" referrerPolicy="no-referrer" />}
              <div className="meta-inputs">
                <input className="input" placeholder={t.loading ? '曲名を探してるよ…' : '曲名（自動で入るよ）'}
                       value={t.title} maxLength={200}
                       onChange={e => update(i, { title: e.target.value })} />
                <input className="input" placeholder={t.loading ? 'アーティストを探してるよ…' : 'アーティスト名（自動で入るよ）'}
                       value={t.artist} maxLength={200}
                       onChange={e => update(i, { artist: e.target.value })} />
              </div>
            </div>
            {bad && <p className="hint err">対応してないリンクみたい。共有ボタンからコピーしたリンクを貼ってね。</p>}
          </div>
        );
      })}
      {tracks.length < 10 && (
        <button className="btn ghost" onClick={() => setTracks(ts => [...ts, emptyTrack()])}>＋ 曲を追加</button>
      )}

      <label className="field" htmlFor="comment">ひとこと（任意）</label>
      <textarea id="comment" className="input" maxLength={100} value={comment}
                onChange={e => setComment(e.target.value)} placeholder="例：駅まで歩くときに聴いてる" />
      <p className="hint">{comment.length} / 100　URLやSNSのIDは書けないよ</p>

      <div style={{ marginTop: 16 }}>
        <button className="btn" disabled={!canSubmit} onClick={submit}>{busy ? '流しています…' : 'このセトリを流す'}</button>
        {!sceneId && <p className="hint">シーンを選んでね</p>}
        {sceneId && filled.length < 3 && <p className="hint">あと{3 - filled.length}曲入れてね</p>}
      </div>
    </div>
  );
}

// ===== じぶん =====
function MeTab({ user, toast, reloadKey, openLogin, openRules }) {
  const [list, setList] = useState(null);
  const [del, setDel] = useState(null);
  const [tracksBy, setTracksBy] = useState({});
  const [open, setOpen] = useState({});
  const guest = !user || user.is_anonymous;

  const load = useCallback(async () => {
    if (guest) { setList([]); return; }
    const { data, error } = await sb.rpc('my_setlists');
    if (error) { toast(errMsg(error)); setList([]); return; }
    setList(data || []);
    const ids = (data || []).map(s => s.setlist_id);
    if (!ids.length) { setTracksBy({}); return; }
    const res = await sb.from('tracks')
      .select('setlist_id,url,service,title,artist,thumbnail,position')
      .in('setlist_id', ids)
      .order('position');
    if (res.error) return;
    const by = {};
    for (const t of res.data) (by[t.setlist_id] = by[t.setlist_id] || []).push(t);
    setTracksBy(by);
  }, [guest]);

  useEffect(() => { load(); }, [load, reloadKey]);

  const remove = async () => {
    const id = del; setDel(null);
    const { error } = await sb.from('setlists').delete().eq('id', id);
    if (error) return toast(errMsg(error));
    toast('セトリを削除したよ');
    load();
  };

  const logout = async () => {
    await sb.auth.signOut();
  };

  const [bye, setBye] = useState(false);
  const deleteAccount = async () => {
    setBye(false);
    const { error } = await sb.rpc('delete_my_account');
    if (error) return toast(errMsg(error));
    await sb.auth.signOut();
    toast('アカウントを削除したよ。今までありがとう');
  };

  return (
    <div>
      <h2>アカウント</h2>
      <div className="card">
        {guest ? (
          <div>
            <p style={{ marginTop: 0 }}>今はゲストで使ってるよ。ログインするとセトリを作ったり、届いた感想を見たりできる。</p>
            <button className="btn" onClick={openLogin}>ログインする</button>
          </div>
        ) : (
          <div className="mine-head">
            <span style={{ wordBreak: 'break-all' }}>{user.email}</span>
            <button className="btn ghost small" onClick={logout}>ログアウト</button>
          </div>
        )}
      </div>

      {!guest && (
        <>
          <h2>あなたが流したセトリ</h2>
          {list === null && <div className="loading" style={{ padding: 20 }}>読み込み中…</div>}
          {list && list.length === 0 && <div className="card empty">まだセトリがないよ。「作る」から流してみよう。</div>}
          {list && list.map(s => (
            <div className="card" key={s.setlist_id}>
              <div className="mine-head">
                <span className="tag">{s.scene}</span>
                <button className="linkish" onClick={() => setDel(s.setlist_id)}>削除</button>
              </div>
              {s.comment && <div className="note">{s.comment}</div>}
              {tracksBy[s.setlist_id] && (
                <>
                  <button className="toggle" aria-expanded={!!open[s.setlist_id]}
                          onClick={() => setOpen(o => ({ ...o, [s.setlist_id]: !o[s.setlist_id] }))}>
                    {open[s.setlist_id] ? '曲を閉じる' : `曲を見る（${tracksBy[s.setlist_id].length}曲）`}
                  </button>
                  {open[s.setlist_id] && (
                    <ul className="tracklist">
                      {tracksBy[s.setlist_id].map((t, i) => <TrackItem key={i} t={t} i={i} />)}
                    </ul>
                  )}
                </>
              )}
              <div className="hint" style={{ marginTop: 10 }}>{s.deliveries}人に届いた</div>
              <div className="counts">
                {STAMPS.filter(st => s.stamps && s.stamps[st.id]).map(st => (
                  <span className="count" key={st.id}>{st.label}<b>{s.stamps[st.id]}</b></span>
                ))}
                {(!s.stamps || Object.keys(s.stamps).length === 0) && <span className="hint">まだスタンプはないよ</span>}
              </div>
            </div>
          ))}
        </>
      )}

      {!guest && (
        <div style={{ textAlign: 'center', marginTop: 28 }}>
          <button className="linkish" style={{ color: 'var(--danger)' }} onClick={() => setBye(true)}>アカウントを削除する</button>
        </div>
      )}

      <footer className="foot">
        <button className="linkish" onClick={openRules}>利用のきまり</button>
        <a className="linkish" href="privacy.html">プライバシーポリシー</a>
      </footer>

      {bye && <Confirm title="アカウントを削除する？" body="流したセトリ、届いたスタンプ、受け取った記録がすべて消えて、元に戻せないよ。" okLabel="削除する" danger onOk={deleteAccount} onCancel={() => setBye(false)} />}
      {del && <Confirm title="このセトリを削除する？" body="届いたスタンプも一緒に消えて、元に戻せないよ。" okLabel="削除する" danger onOk={remove} onCancel={() => setDel(null)} />}
    </div>
  );
}

function Rules({ onClose }) {
  return (
    <Sheet onClose={onClose}>
      <h3>利用のきまり</h3>
      <ul>
        <li>悪口、誹謗中傷、差別的な内容は禁止</li>
        <li>住所・電話番号・SNSのIDなど、個人を特定できる情報は書かない</li>
        <li>出会い目的や勧誘、宣伝のための利用は禁止</li>
        <li>曲は公式サービスのリンクだけを載せてね（違法アップロードのリンクは禁止）</li>
        <li>きまりに反する投稿は、運営が予告なく非表示・削除することがあります</li>
      </ul>
      <button className="btn ghost" onClick={onClose}>閉じる</button>
    </Sheet>
  );
}

function App() {
  const [user, setUser] = useState(undefined);
  const [scenes, setScenes] = useState([]);
  const [tab, setTab] = useState('receive');
  const [toastText, setToastText] = useState('');
  const [loginOpen, setLoginOpen] = useState(false);
  const [rulesOpen, setRulesOpen] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const [fatal, setFatal] = useState('');

  const toast = useCallback((t) => {
    setToastText(t);
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => setToastText(''), 3200);
  }, []);

  useEffect(() => {
    let alive = true;
    const ensureUser = async () => {
      const { data } = await sb.auth.getSession();
      if (data.session) { if (alive) setUser(data.session.user); return; }
      const res = await sb.auth.signInAnonymously();
      if (res.error) { if (alive) { setFatal('ゲストで始められなかった…（' + res.error.message + '）'); setUser(null); } return; }
      if (alive) setUser(res.data.user);
    };
    ensureUser();
    const { data: sub } = sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') { ensureUser(); return; }
      if (session) setUser(session.user);
      if (event === 'SIGNED_IN' && session && !session.user.is_anonymous) setLoginOpen(false);
    });
    sb.from('scenes').select('id,name').order('sort_order').then(({ data, error }) => {
      if (error) setFatal('シーンを読み込めなかった…（' + error.message + '）');
      else setScenes(data || []);
    });
    return () => { alive = false; sub.subscription.unsubscribe(); };
  }, []);

  if (user === undefined) return <div className="loading">読み込み中…</div>;

  const guest = !user || user.is_anonymous;

  return (
    <div className="app">
      <header className="top">
        <div className="logo">
          <svg viewBox="0 0 34 18" aria-hidden="true">
            <path d="M1 9 q4 -7 8 0 t8 0 t8 0 t8 0" fill="none" stroke="#5fd3ff" strokeWidth="2" strokeLinecap="round" style={{ filter: 'drop-shadow(0 0 3px #5fd3ff)' }} />
          </svg>
          <div>
            <h1>音届便</h1>
            <span className="kana">おとどけびん</span>
          </div>
        </div>
        <button className="who" onClick={() => guest ? setLoginOpen(true) : setTab('me')}>
          {guest ? 'ゲスト・ログイン' : 'ログイン中'}
        </button>
      </header>

      {fatal && <div className="card" style={{ borderColor: 'var(--danger)' }}><p className="hint err" style={{ margin: 0 }}>{fatal}</p></div>}

      {tab === 'receive' && <ReceiveTab scenes={scenes} toast={toast} goCreate={() => setTab('create')} />}
      {tab === 'create' && <CreateTab user={user} scenes={scenes} toast={toast}
                                      openLogin={() => setLoginOpen(true)}
                                      onCreated={() => { setReloadKey(k => k + 1); setTab('me'); }} />}
      {tab === 'me' && <MeTab user={user} toast={toast} reloadKey={reloadKey}
                              openLogin={() => setLoginOpen(true)} openRules={() => setRulesOpen(true)} />}

      <nav className="tabs" aria-label="メニュー">
        <div className="inner">
          <button className={tab === 'receive' ? 'on' : ''} onClick={() => setTab('receive')}>
            <svg className="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v2.5c0 1 .6 1.7 1.6 2.4C18.3 9 19 10.7 19 13v5a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-5c0-2.3.7-4 2.4-5.1 1-.7 1.6-1.4 1.6-2.4z"/><path d="M8 15c1.3-.8 2.7-.8 4 0s2.7.8 4 0"/></svg>
            受け取る</button>
          <button className={tab === 'create' ? 'on' : ''} onClick={() => setTab('create')}>
            <svg className="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
            作る</button>
          <button className={tab === 'me' ? 'on' : ''} onClick={() => setTab('me')}>
            <svg className="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
            じぶん</button>
        </div>
      </nav>

      {loginOpen && (
        <Sheet onClose={() => setLoginOpen(false)}>
          <h3>ログイン</h3>
          <p>ゲストで受け取った履歴は、はじめてのメール登録なら引き継がれるよ。</p>
          <LoginForm user={user} toast={toast} onDone={() => setLoginOpen(false)} />
        </Sheet>
      )}
      {rulesOpen && <Rules onClose={() => setRulesOpen(false)} />}
      <Toast text={toastText} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
